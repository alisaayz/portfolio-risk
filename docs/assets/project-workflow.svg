  <text class="body" x="520" y="649" text-anchor="middle">Dated inputs and daily rebalancing; dedicated stress analysis planned</text>
  <path class="line" d="M520 670 V695"/>
  <rect x="210" y="697" width="620" height="76" rx="12" fill="#172b46"/>
  <text x="520" y="727" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Local interactive application (planned)</text>
