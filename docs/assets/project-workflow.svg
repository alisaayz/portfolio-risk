<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" role="img" aria-labelledby="title description">
  <title id="title">Personal Portfolio Risk Platform: implementation workflow</title>
  <desc id="description">The initial market-data acquisition and audit are implemented, with source discrepancies retained for review. Versioned SQL storage and historical return/volatility inputs are also implemented. Historical portfolio risk and baseline comparisons are implemented. Sixteen instruments are accepted under DS-002 after structural and limited source checks. Modeling features, development targets, and fixed-form and trained-model development forecasts are implemented; dedicated stress scenarios and application remain planned. Explainable portfolio adjustment suggestions are a requested later extension.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52647a"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #172b46; }
      .subtitle { font-size: 15px; fill: #52647a; }
      .heading { font-size: 18px; font-weight: 700; fill: #172b46; }
      .body { font-size: 15px; fill: #354a63; }
      .line { fill: none; stroke: #52647a; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #ccd7e4; stroke-width: 1.5; }
      .done { fill: #e7f3ed; stroke: #85b69b; }
    </style>
  </defs>
  <rect width="1040" height="820" rx="18" fill="#f4f7fb"/>
  <text class="title" x="44" y="51">Personal Portfolio Risk Platform</text>
  <text class="subtitle" x="44" y="79">Green: data, SQL, risk, and ML development implemented · final test reserved; app planned</text>
  <rect class="box done" x="210" y="106" width="620" height="76" rx="12"/>
  <text class="heading" x="520" y="136" text-anchor="middle">Historical market data</text>
  <text class="body" x="520" y="161" text-anchor="middle">Daily prices, adjusted prices, dividends, and splits</text>
  <path class="line" d="M520 182 V207"/>
  <rect class="box done" x="210" y="209" width="620" height="76" rx="12"/>
  <text class="heading" x="520" y="239" text-anchor="middle">Python acquisition and validation</text>
  <text class="body" x="520" y="264" text-anchor="middle">16-instrument audit, 80 quote pairs, and four issuer checks</text>
  <path class="line" d="M520 285 V310"/>
  <rect class="box done" x="210" y="312" width="620" height="76" rx="12"/>
  <text class="heading" x="520" y="342" text-anchor="middle">DuckDB SQL and Parquet</text>
  <text class="body" x="520" y="367" text-anchor="middle">DS-002: 16 accepted instruments; index comparator quarantined</text>
  <path class="line" d="M520 388 V411 H278 V436"/>
  <path class="line" d="M520 388 V411 H762 V436"/>
  <rect class="box done" x="54" y="438" width="448" height="104" rx="12"/>
  <text class="heading" x="278" y="468" text-anchor="middle">Historical risk analysis</text>
  <text class="body" x="278" y="493" text-anchor="middle">Volatility, drawdown, and return correlations</text>
  <text class="body" x="278" y="517" text-anchor="middle">Covariance-based holding risk contributions</text>
  <rect class="box done" x="538" y="438" width="448" height="104" rx="12"/>
  <text class="heading" x="762" y="468" text-anchor="middle">Modeling data and trained forecasts</text>
  <text class="body" x="762" y="493" text-anchor="middle">12 features; matched development forecast comparisons</text>
  <text class="body" x="762" y="517" text-anchor="middle">Three ML candidates evaluated; 2026 test reserved</text>
  <path class="line" d="M278 542 V567 H520 V592"/>
  <rect class="box done" x="210" y="594" width="620" height="76" rx="12"/>
